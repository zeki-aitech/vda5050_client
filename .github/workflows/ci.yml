name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The integration smoke test needs an MQTT broker on 127.0.0.1:1883.
      # mosquitto 2.x with no listener configured runs in local-only mode:
      # loopback only, anonymous allowed - exactly what the test expects.
      - name: Install mosquitto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          sudo systemctl start mosquitto

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -q
