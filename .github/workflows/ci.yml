name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10: the robot stack (Ubuntu 22.04); the newest for the rest.
        python-version: ["3.10", "3.13"]
    env:
      # The tests in tests/broker start their own mosquitto on a free port
      # of 127.0.0.1; here a missing mosquitto fails them instead of
      # skipping them.
      VDA5050_REQUIRE_BROKER: "1"
    steps:
      - uses: actions/checkout@v4

      # Only the binary is needed: the tests start their own brokers.
      - name: Install mosquitto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          sudo systemctl stop mosquitto || true

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -q
